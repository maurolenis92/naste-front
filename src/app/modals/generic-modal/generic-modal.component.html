<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3>{{ data.title }}</h3>
      <button (click)="closeModal(true)" class="modal-close">✕</button>
    </div>

    <div class="modal-body">
      <p>{{ data.message }}</p>
    </div>

    <div class="modal-footer">
      <button (click)="closeModal(true)" class="btn btn-outline">
        {{ data.cancelButtonText }}
      </button>
      <button (click)="closeModal(false)" class="btn btn-accent">
        {{ data.confirmButtonText }}
      </button>
    </div>
  </div>
</div>
