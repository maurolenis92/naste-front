<div class="invoices">
  <div class="invoices-header">
    <h1>Facturas</h1>
    <app-button
      label="Nueva factura"
      icon="add"
      variant="accent"
      (click)="navigateToCreateInvoice()"
    ></app-button>
  </div>

  <div class="invoices__list">
    <app-table
      [tableData]="tableData"
      (pageChange)="loadData($event)"
      (actionRowClick)="navigateToInvoiceDetail($event)"
    ></app-table>
  </div>
</div>
