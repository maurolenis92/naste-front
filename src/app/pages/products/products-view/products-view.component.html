<div class="products">
  <div class="products-header">
    <h1>Productos</h1>
    <app-button
      label="Nuevo producto"
      icon="add"
      variant="accent"
      (click)="navigateToCreateProduct()"
    ></app-button>
  </div>

  <div class="products__list">
    <!-- TODO: TEMP DESIGN, REPLACE WITH REAL NAVSEARCH COMPONENT -->
    <div style="display: flex; gap: 1rem; margin-bottom: 1rem">
      <app-input
        style="flex: 1"
        placeholder="Buscar producto"
        [formControl]="searchTerm"
      ></app-input>
      <app-button
        label="Buscar"
        icon="search"
        variant="primary"
        (click)="searchBycode()"
      ></app-button>
      <app-button icon="refresh" variant="outline" (click)="refresh()"></app-button>
    </div>
    <app-table
      [tableData]="tableData"
      (pageChange)="loadData($event)"
      (actionRowClick)="navigateToProductDetail($event)"
    ></app-table>
  </div>
</div>
