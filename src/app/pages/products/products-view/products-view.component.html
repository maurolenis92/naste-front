<div class="products">
  <div class="products-header">
    <h1>Productos</h1>
    <app-button
      label="Nuevo producto"
      icon="add"
      variant="accent"
      (click)="navigateToCreateProduct()"
    ></app-button>
  </div>

  <div class="products__list">
    <app-table
      [tableData]="tableData"
      (pageChange)="loadData($event)"
      (actionRowClick)="navigateToProductDetail($event)"
    ></app-table>
  </div>
</div>
